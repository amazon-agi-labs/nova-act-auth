[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-act-auth"
dynamic = ["version"]
description = "Auth features for Amazon Nova Act agents."
readme = "README.md"
dependencies = [
  "authlib>=1.6.8",
  "bedrock-agentcore>=1.4.6",
  "boto3>=1.42.7",
  "botocore>=1.42.7",
  "playwright>=1.54.0,<=1.56.0",
  "requests>=2.28.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
nova-act = ["nova-act"]

[tool.hatch.version]
path = "src/nova_act_auth/__init__.py"

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_act_auth"]

[tool.hatch.envs.default]
python = "3.12"
dependencies = [
    "fire>=0.7.0",
    "mypy",
    "ruff",
]

[tool.hatch.envs.default.scripts]
typing = [
  "mkdir -p .mypy_cache",
  "mypy --install-types --non-interactive src/nova_act_auth",
]
lint   = ["ruff check src"]
format = [
  "ruff format src",
  "ruff check --fix src",
]
clean = [
  "rm -rf build dist .mypy_cache .ruff_cache",
  "find . -type d -name '__pycache__' | xargs rm -rf",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", ".hatch"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "T20", "SIM", "TCH", "RUF"]
ignore = ["E203"]
isort.known-first-party = ["nova_act_auth"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
disallow_untyped_defs = true
exclude = ["build/*"]

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bedrock_agentcore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fire.*"
ignore_missing_imports = true